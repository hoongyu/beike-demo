<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>备课搭子 · 小程序</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#ebe9e4;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#26221b;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0}
.phone{position:relative;width:384px;height:764px;border-radius:46px;background:#141414;padding:12px;box-shadow:0 30px 60px -24px rgba(0,0,0,.45);transform-origin:center center;flex:none}
.scr{position:relative;width:360px;height:740px;border-radius:34px;background:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-size:13.5px;line-height:1.6}
.status{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;z-index:30}
.status i{width:22px;height:10px;border:1.5px solid #222;border-radius:3px;position:relative}
.status i::after{content:'';position:absolute;inset:1.5px;right:5px;background:#222;border-radius:1px}
.nav{position:absolute;left:0;right:0;top:26px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;background:#fff;z-index:30}
.nav .back{position:absolute;left:8px;top:0;height:44px;width:40px;display:none;align-items:center;justify-content:center;font-size:26px;font-weight:400;cursor:pointer}
.nav.inner .back{display:flex}
.cap{position:absolute;right:10px;top:7px;width:87px;height:30px;border:1px solid #e3e3e3;border-radius:16px;display:flex;align-items:center;justify-content:space-around}
.cap b{width:18px;height:4px;background:radial-gradient(circle,#222 1.6px,transparent 2px) 0 0/6px 4px repeat-x}
.cap s{width:1px;height:18px;background:#e3e3e3}
.cap u{width:16px;height:16px;border:2px solid #222;border-radius:50%;position:relative}
.cap u::after{content:'';position:absolute;inset:3px;background:#222;border-radius:50%}
.demo-badge{position:fixed;left:12px;top:10px;z-index:99;font-size:11px;color:#6b7480;background:rgba(255,255,255,.85);border:1px solid #e3e6eb;border-radius:999px;padding:3px 10px;text-decoration:none}
.press:active,[data-tap]:active{opacity:.55}

/* ── 首页：书架 + 小搭趴着的聊天框（原型画法） ── */
#home{position:absolute;inset:0}
.cls{position:absolute;left:0;right:0;top:70px;height:28px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;z-index:4}
.cls .arr{color:#b7ae9e;font-size:18px;cursor:pointer;padding:0 10px}
.cls .cname{padding:2px 8px;border-radius:5px;cursor:pointer}
.pdots{position:absolute;right:18px;display:flex;gap:5px}
.pdots i{width:6px;height:6px;border-radius:3px;background:#d8d2c6}
.pdots i.on{background:#26221b}
#shelf{position:absolute;left:12px;right:12px;top:102px;will-change:transform}
.cab{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:14px;padding:10px 10px 12px;background:linear-gradient(180deg,#8f5c34,#6b4125);box-shadow:0 18px 30px -16px rgba(60,35,10,.6),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.25);transition:opacity .25s}
.cab::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.42' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.42 0 0 0 0 0.26 0 0 0 0 0.12 0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.grid{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:10px;height:100%}
.cub{position:relative;min-height:0;border-radius:4px;background:linear-gradient(180deg,#2c190d,#46291a 55%,#553321);box-shadow:inset 0 14px 16px -8px rgba(0,0,0,.75),inset 7px 0 10px -6px rgba(0,0,0,.55),inset -7px 0 10px -6px rgba(0,0,0,.55);display:flex;align-items:flex-end;gap:3px;padding:0 9px 9px}
.cub::after{content:'';position:absolute;left:-3px;right:-3px;bottom:0;height:9px;border-radius:1px;background:linear-gradient(180deg,#c99461,#97623b 45%,#6c4426);box-shadow:0 3px 5px rgba(0,0,0,.35)}
.rowcab{opacity:0;pointer-events:none}
.rowcab .cub{height:100%;justify-content:center}
/* 书架皮肤：胡桃木（默认）、原木、白橡、樱桃木、乌木 */
.skin-oak .cab,.kp-wood.skin-oak,.w-oak{background:linear-gradient(180deg,#dcc19b,#c09c70)}
.skin-oak .cab::before{opacity:.35}
.skin-oak .cub,.skin-oak .kp-in,.w-oak .g-cub{background:linear-gradient(180deg,#b89a74,#d6bf9c 55%,#e3cfac);box-shadow:inset 0 14px 16px -8px rgba(70,45,15,.5),inset 7px 0 10px -6px rgba(70,45,15,.35),inset -7px 0 10px -6px rgba(70,45,15,.35)}
.skin-oak .cub::after{background:linear-gradient(180deg,#f2dfbf,#d8b98e 45%,#b8976b)}
.skin-white .cab,.kp-wood.skin-white,.w-white{background:linear-gradient(180deg,#efe6d6,#dccdb3)}
.skin-white .cab::before{opacity:.22}
.skin-white .cub,.skin-white .kp-in,.w-white .g-cub{background:linear-gradient(180deg,#cdbfa4,#e6dccb 55%,#efe8da);box-shadow:inset 0 14px 16px -8px rgba(90,70,40,.42),inset 7px 0 10px -6px rgba(90,70,40,.28),inset -7px 0 10px -6px rgba(90,70,40,.28)}
.skin-white .cub::after{background:linear-gradient(180deg,#fbf6ec,#e6d9c0 45%,#cbbb9b)}
.skin-cherry .cab,.kp-wood.skin-cherry,.w-cherry{background:linear-gradient(180deg,#a4502f,#7a3420)}
.skin-cherry .cub,.skin-cherry .kp-in,.w-cherry .g-cub{background:linear-gradient(180deg,#2e120a,#4a2214 55%,#5c2c1a)}
.skin-cherry .cub::after{background:linear-gradient(180deg,#d2875a,#9a4a2a 45%,#6a2e18)}
.skin-ebony .cab,.kp-wood.skin-ebony,.w-ebony{background:linear-gradient(180deg,#3a332d,#221d19)}
.skin-ebony .cab::before{opacity:.3}
.skin-ebony .cub,.skin-ebony .kp-in,.w-ebony .g-cub{background:linear-gradient(180deg,#0e0c0b,#1b1714 55%,#26201c)}
.skin-ebony .cub::after{background:linear-gradient(180deg,#6a5d50,#3e352d 45%,#241f1a)}
.kp-wood.skin-walnut,.w-walnut{background:linear-gradient(180deg,#8f5c34,#6b4125)}
.skin-walnut .kp-in,.w-walnut .g-cub{background:linear-gradient(180deg,#2c190d,#46291a 55%,#553321)}
/* 书脊：类型色 + 左右明暗 + 上下两道烫金线 + 宋体竖排书名 */
.sp{flex:none;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;border-radius:3px 3px 2px 2px;cursor:pointer;transition:transform .16s ease,opacity .16s,box-shadow .16s;background-color:var(--c);background-image:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.18) 20%,rgba(255,255,255,0) 42%,rgba(0,0,0,.08) 78%,rgba(0,0,0,.36));box-shadow:1px 0 2px rgba(0,0,0,.35);color:var(--t)}
.sp::before,.sp::after{content:'';position:absolute;left:3px;right:3px;height:2px;background:linear-gradient(90deg,#9c7a3c,#ecd593,#9c7a3c);opacity:.85}
.sp::before{top:7px}
.sp::after{bottom:7px}
.spt{display:block;max-height:74%;overflow:hidden;white-space:nowrap;writing-mode:vertical-rl;font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;font-size:10px;font-weight:600;line-height:1.1;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.25);pointer-events:none}
.sp.out{transform:translateY(-12px) scale(1.07);z-index:3;box-shadow:0 12px 16px rgba(0,0,0,.45)}
.sp.gone{opacity:.22}
.mark{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.mark.lock{bottom:12.5px;width:7px;height:5px;border-radius:1px;background:currentColor;opacity:.8}
.mark.lock::before{content:'';position:absolute;left:1px;top:-4px;width:3px;height:4px;border:1px solid currentColor;border-bottom:0;border-radius:3px 3px 0 0}
.mark.ai,.mark.draft{top:10.5px;padding:0 2px;border:.5px solid currentColor;border-radius:2px;font-size:7px;font-weight:700;font-style:normal;line-height:1.35;opacity:.9}
.stack{position:relative;z-index:1;width:61px;height:19px;margin-left:4px}
.stack i{position:absolute;border-radius:1.5px}
.stack .s1{left:0;bottom:0;width:61px;height:9px;background:#7d5a3c linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,.2))}
.stack .s2{left:6px;bottom:9px;width:50px;height:8px;background:#9c4a32 linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,.2))}
.splant{position:relative;z-index:1;flex:none;width:40px;height:62%;margin-left:auto;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
#sheet{position:absolute;left:0;right:0;top:475px;height:700px;will-change:top}
.anim #sheet{transition:top .34s cubic-bezier(.3,.8,.3,1)}
.anim #shelf{transition:height .34s cubic-bezier(.3,.8,.3,1)}
.band{position:absolute;left:0;top:0;z-index:2;overflow:visible;pointer-events:none;filter:drop-shadow(0 -5px 10px rgba(90,60,20,.16)) drop-shadow(0 -1px 1px rgba(90,60,20,.10))}
.wrk{position:absolute;left:0;top:0;z-index:3;overflow:visible;pointer-events:none}
.xd{position:absolute;left:0;top:0;z-index:1;pointer-events:none;will-change:transform,filter}
.xd img{width:100%;height:100%;display:block}
.xd.front{z-index:4}
.lsk{position:absolute;left:0;top:0;width:100%;height:100%;display:none;overflow:visible}
.xd.line .lsk{display:block}
.xd.line img{display:none}
.lsk path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lsk .glow{filter:url(#glowF)}
.lsk .glow path{stroke:rgba(255,182,60,.85);stroke-width:17}
.lsk .mid path{stroke:#dca23c;stroke-width:5}
.lsk .core path{stroke:#fffaf0;stroke-width:2.2}
.lsk .spark{animation:tw 1.8s ease-in-out infinite}
.lsk .spark.s2{animation-delay:.6s}
.lsk .spark.s3{animation-delay:1.2s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.lsk .pw{transition:transform .35s cubic-bezier(.3,1.4,.5,1);transform-box:fill-box;transform-origin:50% 100%}
.xd.line[data-pose=wave] #lpR,.xd.line[data-pose=bashful] #lpR{transform:translate(8px,-56px) rotate(-16deg)}
.xd.line[data-pose=think] #lpR{transform:translate(-34px,-66px) rotate(12deg)}
.xd.line[data-pose=think] #lhead{transform:rotate(-5deg)}
.xd.line[data-pose=cheer] .paw,.xd.line[data-pose=stretch] .paw{transform:translateY(-34px)}
.xd.line[data-pose=welcome] #lpL{transform:translate(-18px,-24px) rotate(16deg)}
.xd.line[data-pose=welcome] #lpR{transform:translate(18px,-24px) rotate(-16deg)}
#xhit{position:absolute;width:108px;height:108px;z-index:5;cursor:pointer;border-radius:50%}
.handle{position:absolute;left:144px;top:2px;width:72px;height:22px;z-index:3;cursor:pointer}
.handle::after{content:'';position:absolute;left:18px;top:8px;width:36px;height:4px;border-radius:2px;background:#e2dbcf}
.bub{position:absolute;z-index:6;padding:7px 12px;border-radius:12px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.14);font-size:13px;white-space:nowrap;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.bub.on{opacity:1;transform:none}

/* 书架档：最近待办 */
#todo{position:absolute;left:17px;right:17px;top:44px;z-index:3;transition:opacity .2s}
#todo h6{font-size:10.5px;font-weight:400;color:#a49b8b;margin-bottom:1px}
.ti{display:flex;align-items:center;height:27px;border-bottom:1px solid #f1ede5;font-size:13.5px;cursor:pointer}
.ti .tc{flex:none;width:22px;height:27px;display:flex;align-items:center}
.ti .tc::before{content:'';width:13.5px;height:13.5px;border-radius:50%;border:1.5px solid #cfc6b4;transition:background .2s,border-color .2s}
.ti span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti em{flex:none;margin-left:8px;font-style:normal;font-size:11.5px;color:#a49b8b}
.ti.key span{font-weight:600}
.ti.key em{color:#bf3b26;font-weight:600}
.ti.ticked .tc::before{background:#07c160;border-color:#07c160}
.ti.ticked span{color:#a49b8b;text-decoration:line-through}
.ti.warn span{color:#bf3b26;font-weight:600}
.ti .tdot{flex:none;width:7px;height:7px;margin:0 11px 0 4px;border-radius:4px;background:#bf3b26}
.ti.none{border-bottom:0;cursor:default}
.ti.none span{color:#a49b8b}

/* 对话档：聊天记录，照微信 */
.chat{position:absolute;left:0;right:0;top:52px;height:300px;z-index:3;opacity:0;overflow-y:auto;overflow-x:hidden;transition:opacity .2s;touch-action:pan-y;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.msgs{padding:4px 13.5px 13.5px}
.m{display:flex;flex-direction:column;margin:7px 0}
.m.me{align-items:flex-end}
.m.xm{align-items:flex-start}
.mb{max-width:78%;padding:8px 10.5px;border-radius:7px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.mb.me{background:#95ec69;color:#111}
.mb.xm{background:#f2f2f2;color:#26221b}
.mb.vtext{margin-top:4px;background:#fff;border:1px solid #e5e5e5;color:#333;font-size:12.5px}
.mb.voice{display:flex;align-items:center;justify-content:flex-end;min-width:58px;cursor:pointer}
.vw{display:flex;align-items:center;margin-left:7px}
.vw i{width:2px;margin-left:2.5px;border-radius:1px;background:#111}
.vw i:nth-child(1){height:6px}.vw i:nth-child(2){height:10.5px}.vw i:nth-child(3){height:15px}
.mb.voice.on .vw i{animation:blink .9s ease-in-out infinite}
.mb.voice.on .vw i:nth-child(2){animation-delay:.15s}
.mb.voice.on .vw i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.mq{max-width:70%;margin-top:4px;padding:4px 8px;border-radius:4px;background:#ececec;color:#7a7a7a;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mph{width:134px;border-radius:6px;cursor:pointer;display:block}
.mfile{display:flex;align-items:center;width:211px;padding:10.5px;border:1px solid #ececec;border-radius:6px;background:#fff;cursor:pointer}
.mf-n{flex:1;min-width:0;font-size:12.5px;color:#26221b;word-break:break-all}
.mf-ic{flex:none;width:34px;height:40px;margin-left:9px;border-radius:3px;background:#c47f58;color:#fff;font-size:9.5px;font-weight:600;text-transform:uppercase;display:flex;align-items:center;justify-content:center}
.mb.think{display:flex;align-items:center;height:35px}
.mb.think i{width:6px;height:6px;margin:0 3px;border-radius:3px;background:#a49b8b;animation:hop 1.1s ease-in-out infinite}
.mb.think i:nth-child(2){animation-delay:.15s}
.mb.think i:nth-child(3){animation-delay:.3s}
@keyframes hop{30%{transform:translateY(-5px);opacity:1}0%,60%,100%{transform:none;opacity:.5}}
.qacts{display:flex;flex-wrap:wrap;max-width:94%;margin-top:6px}
.qact{margin:0 7px 7px 0;padding:5px 12.5px;border-radius:15px;border:1px solid #e0d8c8;background:#fff;color:#26221b;font-size:12.5px;cursor:pointer}
.scard{width:94%;margin-top:6px;padding:0 11.5px 4px;border:1px solid #ece6da;border-radius:8px;background:#fff}
.scard .it:first-child{border-top:0}
.sc-all{padding:8.5px 0 5px;border-top:1px solid #f1ede5;text-align:center;font-size:12.5px;font-weight:600;color:#07a85a;cursor:pointer}
.res{display:flex;align-items:center;width:82%;margin-top:6px;padding:8.5px;border:1px solid #ece6da;border-radius:8px;background:#fff;cursor:pointer}
.res-sp,.bs-spine{flex:none;display:flex;align-items:center;justify-content:center;border-radius:2px 2px 1.5px 1.5px;background-image:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.16) 22%,rgba(255,255,255,0) 44%,rgba(0,0,0,.32))}
.res-sp{width:22px;height:60px}
.res-sp span,.bs-spine span{display:block;max-height:82%;overflow:hidden;writing-mode:vertical-rl;font-family:"Songti SC","STSong","SimSun",serif;font-size:9px;font-weight:600;letter-spacing:.5px;line-height:1.1}
.res-r{flex:1;min-width:0;margin-left:10.5px}
.res-t{font-size:13.5px;font-weight:600;color:#26221b}
.res-tags{margin-top:5px;display:flex;align-items:center;flex-wrap:wrap}
.res-on{font-size:10.5px;color:#a49b8b}
.btag{display:inline-block;margin-right:5px;padding:1px 6px;border-radius:3px;font-size:9.5px;line-height:1.6}
.btag.ai{background:#26221b;color:#fff}.btag.pc{background:#e8efe9;color:#2f5a4a}.btag.draft{background:#f6ecd9;color:#8a5a12}.btag.lock{background:#efe8d8;color:#5a5246}

/* 悬停卡：半透明圆角，毛玻璃 */
.card{position:absolute;z-index:8;width:168px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 30px rgba(40,25,5,.22);font-size:12px;line-height:1.5;color:#4a4236;opacity:0;transform:scale(.96);transition:opacity .15s,transform .15s;pointer-events:none;cursor:pointer}
.card.on{opacity:1;transform:none}
.card b{display:block;font-size:14px;color:#26221b}
.card small{display:block;color:#8d826e;margin:2px 0 4px;font-size:11.5px}
#ghost{position:absolute;left:0;top:0;z-index:9;display:none;pointer-events:none;transition:none;box-shadow:0 18px 24px rgba(0,0,0,.35)}

/* ── 输入栏：照微信（语音和键盘切换、按住说话、输入框、＋ 或发送；引用条在下面） ── */
.bar{position:absolute;left:0;right:0;bottom:50px;z-index:7;padding:7px 6px;background:#f7f7f7;border-top:1px solid #e5e5e5}
.wxrow{display:flex;align-items:flex-end}
.wx-ic{flex:none;width:35px;height:35px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wx-ic img{width:27px;height:27px}
.wx-in{flex:1;width:0;min-height:35px;max-height:96px;margin:0 6px;padding:8px 9px;line-height:19px;border:0;outline:0;border-radius:4px;background:#fff;font:inherit;font-size:15px;color:#181818;resize:none;overflow-y:auto;touch-action:pan-y}
.wx-hold{flex:1;height:35px;margin:0 6px;line-height:35px;border-radius:4px;background:#fff;text-align:center;font-size:14.5px;font-weight:600;color:#181818;cursor:pointer;touch-action:none}
.wx-hold.on{background:#c7c7c7}
.wx-send{flex:none;height:33px;margin:1px 2px 1px 0;padding:0 12.5px;line-height:33px;border-radius:4px;background:#07c160;color:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
.wx-send.wait{opacity:.6}
.wxquote{display:flex;align-items:center;margin:6px 40px 0 46px;padding:5px 8px;border-radius:4px;background:#ececec;font-size:11.5px;color:#7a7a7a}
.wq-t{display:block;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wq-x{flex:none;width:17px;height:17px;margin-left:6px;line-height:16px;border-radius:9px;background:#c8c8c8;color:#fff;font-size:12.5px;text-align:center;cursor:pointer}
.wxplus{display:flex;flex-wrap:wrap;padding:13.5px 8px 3px}
.wp{width:25%;margin-bottom:9px;display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:#7a7a7a;cursor:pointer}
.wp-ic{width:54px;height:54px;margin-bottom:5px;border-radius:11.5px;background:#fff;display:flex;align-items:center;justify-content:center}
.wp-ic img{width:27px;height:27px}
.wx-rec{position:absolute;left:108px;top:224px;z-index:60;width:144px;height:144px;display:none;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:rgba(17,17,17,.72);color:#fff;pointer-events:none}
.wx-rec.on{display:flex}
.wx-rec-bars{display:flex;align-items:center;height:46px}
.wx-rec-bars i{width:5px;height:13.5px;margin:0 3px;border-radius:2.5px;background:#fff;animation:wave .9s ease-in-out infinite}
@keyframes wave{50%{height:40px}}
.wx-rec-sec{margin-top:4px;font-size:12.5px;opacity:.85}
.wx-rec-t{margin-top:9px;padding:3px 8px;border-radius:3px;font-size:12.5px}
.wx-rec.cancel .wx-rec-bars i{animation:none;opacity:.5}
.wx-rec.cancel .wx-rec-t{background:#fa5151}

/* ── 底栏 ── */
.tabs{position:absolute;left:0;right:0;top:690px;height:50px;background:#fff;border-top:1px solid #f0ece4;display:flex;z-index:8;font-size:12.5px;color:#a49b8b;transition:transform .3s ease}
.tabs.hide{transform:translateY(120%)}
.tabs div{position:relative;flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tabs .on{color:#26221b;font-weight:600}
.tabs .badge{position:absolute;top:9px;left:50%;margin-left:21px;min-width:14.5px;height:14.5px;line-height:14.5px;padding:0 4px;border-radius:7px;background:#bf3b26;color:#fff;font-size:9.5px;font-weight:600;font-style:normal;text-align:center}

/* ── 栏目页（资料中心、任务清单、小贝壳超市、某一类资料） ── */
.page{position:absolute;left:0;right:0;top:70px;bottom:50px;overflow-y:auto;overflow-x:hidden;background:#fff;display:none;touch-action:pan-y;scrollbar-width:none;padding-bottom:24px}
.page::-webkit-scrollbar{display:none}
.page.on{display:block}
.page.full{bottom:0}
.pcard{background:#fff;margin:0 15px;padding:11.5px 0;border-top:1px solid #efe9de}
.pcard:first-child{border-top:0}
.h1{font-size:19px;font-weight:600;letter-spacing:1px}
.sub{font-size:11.5px;color:#a49b8b}
.row{display:flex;align-items:center}
.flex{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;height:35px;padding:0 15px;border-radius:6px;font-size:12.5px;background:#f2efe8;color:#26221b;cursor:pointer;white-space:nowrap}
.btn.primary{background:#07c160;color:#fff;font-weight:600}
.btn.ghost{background:transparent;border:1px solid #e0d8c8}
.btn.disabled{opacity:.45;cursor:default}
.btn.sm{height:27px;padding:0 12.5px;font-size:11.5px}
.btn.wide{display:flex;width:100%;height:40px}
.sec{font-size:14.5px;font-weight:600}
.pill{font-size:10.5px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.pill.done{background:#e3f1ec;color:#0f8a6c}.pill.sent{background:#f6ecd9;color:#8a5a12}
.pill.ai{background:#26221b;color:#fff}.pill.pc{background:#e8efe9;color:#2f5a4a}.pill.draft{background:#f6ecd9;color:#8a5a12}.pill.lock{background:#efe8d8;color:#5a5246}
.empty{text-align:center;color:#a49b8b;padding:23px 0;font-size:12.5px}
.seg{display:flex;margin:10px 15px 4px;background:#f2efe8;border-radius:7px;padding:3px}
.seg-item{flex:1;text-align:center;height:29px;line-height:29px;border-radius:5px;font-size:12.5px;color:#5a5246;cursor:pointer;white-space:nowrap}
.seg-item.on{background:#fff;color:#26221b;font-weight:600;box-shadow:0 1px 3px rgba(60,45,20,.1)}
.head{padding:13.5px 15px 4px}
.lshelf{padding:12.5px 0;border-top:1px solid #f1ede5;cursor:pointer}
.lshelf:first-child{border-top:0}
.ltag{width:6px;height:31px;border-radius:1.5px;flex:none}
.lshelf-t{margin-left:10.5px;min-width:0;flex:1}
.lshelf-k{font-size:14.5px;font-weight:600}
.last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-size:16px;font-weight:600;color:#5a5246;margin-left:8px}
.larr{font-size:17px;color:#c8bfae;margin-left:7px;line-height:1}
.photos{display:flex;flex-wrap:wrap;margin:8px -4px 0}
.thumb{width:94px;height:71px;border-radius:5px;margin:4px;object-fit:cover;cursor:pointer}
.ins{padding:8.5px 0;border-top:1px solid #f1ede5;font-size:13.5px}
.mine .sec+.ins{border-top:0}
.sit{padding:10.5px 0;border-top:1px solid #f1ede5}
.sit:first-child{border-top:0}
.sit-t{flex:1;min-width:0;cursor:pointer}
.sit-n{font-size:13.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sit .pill{flex:none;margin-left:6px}
.on-btn{flex:none;margin-left:8px;padding:4px 10px;border-radius:4px;border:1px solid #e0d8c8;font-size:11.5px;color:#26221b;cursor:pointer;white-space:nowrap}
.on-btn.on{border-color:transparent;background:#f2efe8;color:#8d826e}

/* 一件事的卡片：快速记录和任务清单共用 */
.it{padding:10.5px 0;border-top:1px solid rgba(34,30,23,.07)}
.it .tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:4px;cursor:pointer}
.tag.prep{background:#fbebe5;color:#a02e1a}.tag.insight{background:#e3f1ec;color:#0f8a6c}.tag.todo{background:#f6ecd9;color:#8a5a12}
.it .kl{font-size:10.5px;color:#514a3b;background:#efe8d8;padding:1px 7px;border-radius:4px;margin-left:6px;cursor:pointer}
.it .kl.ghost{background:transparent;border:1px dashed rgba(34,30,23,.25);color:#8c8372}
.it .txt{font-size:13.5px;margin:6px 0 7px;cursor:pointer}
.it .acts .btn+.btn{margin-left:8px}

/* 小贝壳超市：舞台在上，往下滑收成一条；超市从舞台下面开始 */
.stagewrap{position:sticky;top:0;height:0;z-index:20}
.stage{position:absolute;top:0;left:0;right:0;overflow:hidden;background:linear-gradient(180deg,#f7f2e8 0%,#fff 100%)}
.sglow{position:absolute;left:10%;right:10%;bottom:-10px;height:86px;border-radius:50%;background:radial-gradient(closest-side,rgba(233,214,176,.9),rgba(233,214,176,0))}
.prop{position:absolute;bottom:17px;filter:drop-shadow(0 4px 4px rgba(34,30,23,.18))}
.prop.plant{left:5%;width:15%}
.prop.bag{right:7%;width:14%}
.fig{position:absolute;bottom:12px;transform-origin:50% 100%;z-index:2}
.bob{animation:bob 3.6s ease-in-out infinite}
.hop{transform-origin:50% 100%;cursor:pointer}
.hop.ta{animation:hopA .7s cubic-bezier(.3,1.4,.5,1)}
.hop.tb{animation:hopB .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hopA{25%{transform:scale(1.07,.92)}55%{transform:translateY(-15px) scale(.97,1.05) rotate(-3deg)}80%{transform:scale(1.04,.97)}}
@keyframes hopB{25%{transform:scale(1.07,.92)}55%{transform:translateY(-15px) scale(.97,1.05) rotate(-3deg)}80%{transform:scale(1.04,.97)}}
.xfig{position:relative}
.xfig .img{display:block}
.xfig .acc{position:absolute;filter:drop-shadow(0 1.5px 1.5px rgba(34,30,23,.25));animation:popin .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{opacity:0}to{opacity:1}}
.say{position:absolute;top:42px;left:50%;transform:translateX(-50%);z-index:3;max-width:86%;padding:5px 13.5px;border-radius:48px;background:#fff;font-size:12.5px;color:#5a5246;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #efe9de}
.mini{position:absolute;left:30%;top:50%;transform:translateY(-50%)}
.mini-t{font-size:15.5px;font-weight:700;letter-spacing:1px}
.bal{position:absolute;top:10px;right:13.5px;z-index:3;display:flex;align-items:center;height:27px;padding:0 9px 0 6px;border-radius:14px;background:#fff;border:1px solid #efe9de;font-size:12.5px;font-weight:600}
.bal img{width:16px;height:16px;margin-right:3px}
.shop .seg{position:sticky;z-index:5;background:#f2efe8}
.ggrid{display:flex;flex-wrap:wrap;padding:6px 10px}
.goods{width:calc(33.33% - 12px);margin:6px;background:#fff;border-radius:8px;padding:10.5px 0;display:flex;flex-direction:column;align-items:center;border:1px solid #efe9de;cursor:pointer}
.goods.on{border-color:#26221b}
.goods.try{border-color:#bf3b26;background:#fdf3ef}
.goods .btn.sm{height:25px;padding:0 12.5px;font-size:11.5px;margin-top:6px}
.g-wood{width:54px;height:46px;margin-bottom:4px;padding:6px;border-radius:5px}
.g-cub{width:100%;height:100%;border-radius:2px}
.g-line{width:42px;height:42px;border-radius:21px;background:#26221b;box-shadow:inset 0 0 0 2px #dca23c,0 0 9px rgba(255,182,60,.6);color:#ffe7b0;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.g-pic{width:54px;height:46px;margin-bottom:4px;display:flex;align-items:center;justify-content:center}
.g-pic img{width:100%;height:100%;object-fit:contain}
.g-ic{width:42px;height:42px;border-radius:21px;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.g-name{font-size:12.5px;font-weight:600}

/* ── 弹层：书、某一类资料里的一份、书架皮肤、认字结果、相机、提示框、操作菜单 ── */
.mask{position:absolute;inset:0;z-index:40;background:rgba(30,24,16,.38);display:none}
.mask.on{display:block}
.psheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:17px 17px 0 0;padding:17px 17px 15px;display:none;animation:up .25s ease;touch-action:pan-y}
.psheet.on{display:block}
@keyframes up{from{transform:translateY(30%);opacity:0}to{transform:none;opacity:1}}
.bs-head{display:flex;align-items:flex-start}
.bs-spine{width:27px;height:72px}
.bs-ht{flex:1;min-width:0;margin-left:11.5px}
.bs-t{font-size:16px;font-weight:600;color:#26221b;line-height:1.4}
.bs-s{margin-top:3px;font-size:11.5px;color:#8d826e}
.bs-tags{margin-top:6px}
.bs-x{flex:none;width:27px;height:27px;line-height:25px;text-align:center;font-size:21px;color:#b7ae9e;cursor:pointer}
.bs-body{max-height:330px;margin-top:11.5px;overflow-y:auto;touch-action:pan-y}
.bs-photo{display:block;width:100%;margin-bottom:6px;border-radius:6px}
.bs-file{display:flex;align-items:center;margin-bottom:6px;padding:10px;border:1px solid #ececec;border-radius:6px;font-size:12.5px;color:#26221b;cursor:pointer}
.bs-file .mf-ic{margin:0 10px 0 0}
.bs-sec{padding:8.5px 0;border-top:1px solid #f1ede5}
.bs-sec:first-child{border-top:0}
.bs-h{font-size:11.5px;color:#a49b8b;letter-spacing:1px}
.bs-p{display:block;margin-top:3px;font-size:13.5px;line-height:1.6;color:#26221b;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.bs-acts,.oacts{display:flex;margin-top:11.5px}
.bbtn{flex:1;height:40px;line-height:40px;border-radius:6px;background:#f2efe8;text-align:center;font-size:13.5px;color:#26221b;cursor:pointer}
.bbtn+.bbtn{margin-left:10px}
.bbtn.go{background:#07c160;color:#fff;font-weight:600}
.kp-t{margin-bottom:13.5px;font-size:14.5px;font-weight:600;color:#26221b}
.kp-row{display:flex;justify-content:space-between}
.kp-sw{width:60px;text-align:center;font-size:10.5px;color:#5a5246;cursor:pointer}
.kp-wood{width:60px;height:60px;margin-bottom:5px;padding:7px;border-radius:9px;outline:2px solid transparent;outline-offset:2px}
.kp-in{width:100%;height:100%;border-radius:3px}
.kp-sw.on .kp-wood{outline-color:#26221b}
.kp-sw.on span{color:#26221b;font-weight:600}
.kp-sw.lock{opacity:.45}
.oimg{flex:none;width:72px;height:54px;margin-right:10px;border-radius:6px;background:#efe8d8;object-fit:cover}
.otext{display:block;width:100%;height:144px;margin:10px 0 0;padding:8px 10px;border:0;outline:0;border-radius:8px;background:#f7f5f0;font:inherit;font-size:13.5px;line-height:1.6;resize:none;touch-action:pan-y}
.cam{position:absolute;inset:0;z-index:45;background:#000;display:none;flex-direction:column}
.cam.on{display:flex}
.cam-v{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam-v img{width:92%;transform:rotate(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cam-b{height:130px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;color:#fff;font-size:15px}
.cam-b span{width:60px;cursor:pointer}
.shut{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #000,0 0 0 7px #fff;cursor:pointer}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.9;transition:none}
.toast{position:absolute;left:50%;top:44%;z-index:70;max-width:240px;padding:10px 16px;border-radius:8px;background:rgba(17,17,17,.78);color:#fff;font-size:13.5px;line-height:1.5;text-align:center;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.dlg{position:absolute;left:28px;right:28px;top:50%;z-index:66;transform:translateY(-50%);background:#fff;border-radius:12px;overflow:hidden;display:none;text-align:center}
.dlg.on{display:block}
.dlg-b{padding:24px 20px 18px}
.dlg-t{font-size:16px;font-weight:600}
.dlg-c{margin-top:8px;font-size:14px;color:#5a5246;white-space:pre-wrap;line-height:1.6}
.dlg-in{display:block;width:100%;margin-top:12px;padding:8px 10px;border:1px solid #e5e5e5;border-radius:6px;font:inherit;font-size:14px;outline:0;resize:none;height:72px;touch-action:pan-y}
.dlg-f{display:flex;border-top:1px solid #eee}
.dlg-f span{flex:1;height:50px;line-height:50px;font-size:16px;cursor:pointer}
.dlg-f span+span{border-left:1px solid #eee}
.dlg-f .ok{color:#07a85a;font-weight:600}
.dmask{position:absolute;inset:0;z-index:65;background:rgba(0,0,0,.45);display:none}
.dmask.on{display:block}
.asheet{position:absolute;left:0;right:0;bottom:0;z-index:66;background:#f7f7f7;border-radius:12px 12px 0 0;overflow:hidden;display:none;animation:up .2s ease}
.asheet.on{display:block}
.asheet div{height:54px;line-height:54px;text-align:center;background:#fff;font-size:16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.asheet div.cancel{margin-top:8px;border-bottom:0}
</style>
