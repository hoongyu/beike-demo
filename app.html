<div id="app">
  <header class="topbar">
    <div class="logo">
      <div class="mk">备</div>
      <div class="nmw"><span class="nm">备课搭子</span><span class="sub">让每节课都算数</span></div>
    </div>
    <nav class="flow" id="stepper" aria-label="演示步骤"></nav>
    <div class="chip">演示原型 · 模拟数据</div>
  </header>

  <main class="stage">

    <section class="view" id="v2"></section>
    <section class="view" id="v3"></section>
    <section class="view" id="v4"></section>
    <section class="view" id="v5"></section>
    <section class="view" id="v6"></section>
  </main>

  <footer class="cue">
    <span class="n" id="cue-n"></span>
    <span class="t" id="cue-t"></span>
    <span class="sp"></span>
    <span class="ref" id="cue-ref"></span>
    <span class="keys"><kbd>空格</kbd> 推进 <kbd>←</kbd><kbd>→</kbd> 切幕</span>
    <button class="navbtn" id="nav-prev" aria-label="上一幕">←</button>
    <button class="navbtn" id="nav-next" aria-label="下一幕">→</button>
  </footer>
</div>
<div id="guide-layer" hidden>
  <div class="guide" role="dialog" aria-label="操作说明">
    <div class="g-kicker">备课搭子 · 产品演示 —— 模拟数据</div>
    <div class="g-title">三分钟，走完李老师的一个学期</div>
    <p class="g-desc">这是一个<b>可以点的演示</b>：你将跟着初中数学李老师，从开学建档到期末整理申报材料，把六步流程亲手走一遍。</p>
    <div class="g-keys">
      <div class="g-key"><kbd>空格</kbd><span>推进剧情<i>每按一次，演示往前走一步</i></span></div>
      <div class="g-key"><kbd>←</kbd><kbd>→</kbd><span>切换六幕<i>也可点顶部的步骤数字</i></span></div>
      <div class="g-key"><em>手机</em><span>直接点界面里<b>发光的按钮</b><i>红色光圈 = 下一步点这里</i></span></div>

    <button class="btn g-start" id="guide-start">开始演示</button>
    <div class="g-foot">全程模拟数据 · 人物与班级均为虚构</div>
  </div>
</div>
<div id="pop-layer" hidden></div>
<div id="toast-layer"></div>
