<body>
<div id="app">
  <header class="topbar">
    <div class="logo">
      <div class="mk">备</div>
      <div class="nmw"><span class="nm">备课搭子</span><span class="sub">让每节课都算数</span></div>
    </div>
    <div class="crumb" id="crumb"><span class="c0">我的工作台</span><span class="c1" id="crumb-page"></span></div>
    <span class="sp"></span>
    <button class="where" id="pet-where" title="多端任务中心"><i></i><span id="pet-where-t">3 台终端 · 已同步</span></button>
    <button class="helpbtn" id="help-btn" aria-label="操作说明" title="操作说明">?</button>
    <div class="chip">演示原型 · 模拟数据</div>
  </header>

  <div class="frame">
    <aside class="side" id="side" aria-label="工作台导航"></aside>
    <main class="stage" id="stage"></main>
  </div>

  <footer class="cue">
    <span class="n" id="cue-n"></span>
    <span class="t" id="cue-t"></span>
    <span class="sp"></span>
    <span class="ref" id="cue-ref"></span>
    <span class="keys"><kbd>空格</kbd> 推进 <kbd>←</kbd><kbd>→</kbd> 换页</span>
    <button class="navbtn" id="nav-prev" aria-label="上一页">←</button>
    <button class="navbtn" id="nav-next" aria-label="下一页">→</button>
  </footer>
</div>
<div id="guide-layer" hidden>
  <div class="guide" role="dialog" aria-label="操作说明">
    <div class="g-kicker">备课搭子 · 教师工作台演示 · 模拟数据</div>
    <div class="g-title">三分钟，走完陈老师的一个学期</div>
    <p class="g-desc">这是一个<b>可以点的演示</b>：左栏是陈老师的工作台。「备课与积累」六页按学期顺序走一遍；「随身与多端」两页看手机上的小搭怎么接活、怎么跟着你换终端。</p>
    <div class="g-keys">
      <div class="g-key"><kbd>空格</kbd><span>推进剧情<i>每按一次，当前页往前走一步</i></span></div>
      <div class="g-key"><kbd>←</kbd><kbd>→</kbd><span>换页<i>也可点左栏任意一页</i></span></div>
      <div class="g-key"><em>手机</em><span>直接点界面里<b>发光的按钮</b><i>红色光圈 = 下一步点这里</i></span></div>
    </div>
    <button class="btn g-start" id="guide-start">开始演示</button>
    <div class="g-foot">全程模拟数据 · 人物与班级均为虚构</div>
  </div>
</div>
<div id="pop-layer" hidden></div>
<div id="toast-layer"></div>
</body>
</html>
