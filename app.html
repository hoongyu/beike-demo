<div id="app">
  <aside class="shell-side">
    <div class="brand"><img class="seal" id="brand-logo" alt="备课搭子"><div><b>备课搭子</b><i>让每节课都算数</i></div></div>
    <nav class="side" id="side" aria-label="工作台导航"></nav>
  </aside>
  <div class="shell-main">
    <header class="topbar">
      <div class="crumb" id="crumb"><span class="c0" id="crumb-0">两分钟看懂</span><span class="c1" id="crumb-page"></span></div>
      <span class="sp"></span>
      <button class="where shellbtn" id="shell-btn" title="小贝壳超市"><svg viewBox="0 0 24 24" aria-hidden="true"></svg><span>小贝壳 <b class="num" data-shells>12</b></span></button>
      <button class="where" id="pet-where" title="多端任务中心"><i></i><span id="pet-where-t">3 台终端 · 已同步</span></button>
      <button class="helpbtn" id="help-btn" aria-label="操作说明" title="操作说明">?</button>
      <div class="chip">演示原型 · 模拟数据</div>
    </header>
    <main class="stage" id="stage"></main>
  </div>
</div>
<div id="guide-layer" hidden>
  <div class="guide" role="dialog" aria-label="操作说明">
    <div class="g-kicker">备课搭子 · 教师工作台演示 · 模拟数据</div>
    <div class="g-title">怎么操作</div>
    <p class="g-desc">左栏 1 到 8 是一位老师一天的用法，<b>每一页都能直接点</b>。</p>
    <div class="g-keys">
      <div class="g-key"><kbd>空格</kbd><span>推进剧情<i>每按一次，当前页往前走一步</i></span></div>
      <div class="g-key"><kbd>←</kbd><kbd>→</kbd><span>换页<i>也可点左栏任意一页</i></span></div>
      <div class="g-key"><em>手机</em><span>直接点界面里<b>发光的按钮</b><i>红色光圈 = 下一步点这里</i></span></div>
    </div>
    <button class="btn g-start" id="guide-start">开始演示</button>
    <div class="g-foot">全程模拟数据 · 人物与班级均为虚构</div>
  </div>
</div>
<div id="pop-layer" hidden></div>
<div id="toast-layer"></div>
